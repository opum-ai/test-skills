# test-policy.toml: the machine-checked half of TEST-CONSTITUTION.md.
# `python3 <tmx>/tmx.py gate --policy test-policy.toml ...` enforces it in CI.
# Change it only by amendment (Article XIII).
version = 1
rigor = "R3"                  # project default profile: R1 Minimal .. R5 High-Assurance (see rigor spec)
constitution = "TEST-CONSTITUTION.md"
baseline = ".test-baseline.json"
source = ["skills/test-audit/scripts/tmx"]                 # source roots; used for private-API coupling checks
test_roots = ["tests"]               # evals/fixtures holds deliberately bloated suites

[budget]                            # Article II
max_tests = 60           # total ceiling; default ~= current count after the first audit
max_suite_seconds = 60 # PR-tier wall time (JUnit sum)
max_new_tests_per_pr = 8            # more needs a `Test-Budget: <reason>` trailer

# Article III: risk tiers. Minimum mutation scores; the first tier matching a mutant's file wins,
# so list the most critical first. Leave min_mutation_score unset for "measure, don't gate".
# A tier with `rigor` gets that profile's floors (R4: 0.80 + survivor triage; R5: 0.90 + history).
[[adequacy.tier]]
name = "critical"
paths = ["skills/test-audit/scripts/tmx/cover.py", "skills/test-audit/scripts/tmx/gate.py", "skills/test-audit/scripts/tmx/rigor.py", "skills/test-audit/scripts/tmx/matrix.py"]
rigor = "R4"             # raises every change touching these paths; a level's floors only rise
min_mutation_score = 0.80

[[adequacy.tier]]
name = "standard"
paths = ["skills/test-audit/scripts/tmx/*", "skills/test-audit/scripts/tmx/**"]
min_mutation_score = 0.60

[[adequacy.tier]]
name = "glue"
paths = ["**/cli.py", "**/__main__.py", "**/config*.py", "**/settings*.py"]

[admission]                         # Articles IV, V, VI
forbid_smells = ["no-assertion", "tautology", "swallowed-exception", "sleep", "skipped"]
max_mocks_per_test = 3
require_unique_kill = true          # needs a matrix in CI (nightly or on the diff)
protected = ["*regression*", "*::test_bug_*"]   # kept even without a unique kill; still budgeted

[flaky]                             # Article XI
quarantine_file = ".test-quarantine.json"
quarantine_days = 14
max_skipped = 0

[probation]                         # Article XII / ADR-0003
marker = "probation"                # pytest marker (or directory tests/probation/)
days = 14
min_nightly_runs = 20

[assurance]                         # R4/R5 (Art. XIII): approval evidence and survivor triage
approvers = []                      # e.g. ["alice", "org/payments-leads"]; CI passes TMX_PR_APPROVERS
triage_file = "testing/survivors.json"   # {"file:line:op:desc": {"verdict": "equivalent", "reason": "..."}}

[tiers]                             # Article X; used by the test-ci skill
pr = "fast, hermetic tests; excludes probation and slow"
nightly = "everything, plus probation, plus mutation matrix and gate --matrix"
