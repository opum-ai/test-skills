name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Test (retry flaky runs)
        run: |
          for attempt in 1 2 3; do
            if pytest tests -v; then
              exit 0
            fi
            echo "pytest failed (attempt $attempt), retrying..."
          done
          exit 1
