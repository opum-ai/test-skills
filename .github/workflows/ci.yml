name: ci
on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: "23 4 * * *"            # nightly: slow tier (nested real mutation runs)
permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r evals/requirements.txt
      - name: Engine tests (PR tier)
        run: python -m pytest -q -m "not slow" --junitxml=report.xml
      - name: Test constitution gate (this repo's own policy)
        if: github.event_name == 'pull_request'
        env:
          TMX_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 skills/test-audit/scripts/tmx.py gate --policy test-policy.toml --junit report.xml --base origin/${{ github.base_ref }}

  slow:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r evals/requirements.txt
      - run: python -m pytest -q -m slow
