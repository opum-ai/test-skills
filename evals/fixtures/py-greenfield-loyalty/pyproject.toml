[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loyalty"
version = "0.2.0"
description = "Loyalty members and points ledgers"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]

[tool.setuptools]
packages = ["loyalty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
